name: Validate Delivery Pizzaria

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: |
          node --check assets/app.js
          node --check assets/customer-auth.js
          node --check assets/ui.js
          node --check account/account.js
          node --check account/receipt.js
          node --check admin/admin.js
          node --check admin/print.js
          node --check service-worker.js
          node --check functions/index.js

      - name: Test Module 1 order security
        run: node tests/module1-order-security.mjs

      - name: Test Module 2 cash ledger
        run: node tests/module2-cash-ledger.mjs

      - name: Test Module 3 security and LGPD
        run: node tests/module3-security-lgpd.mjs

      - name: Detect common selector mistakes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for path in [Path('assets/app.js'), Path('account/account.js'), Path('admin/admin.js')]:
              text = path.read_text(encoding='utf-8')
              bad = re.findall(r"(?<!\$)\$\([^\n;]+\)\.forEach\(", text)
              if bad:
                  raise SystemExit(f"{path}: possível uso de seletor único com forEach: {bad[:5]}")
              if '$$$(' in text:
                  raise SystemExit(f"{path}: seletor inválido $$$ encontrado")
          print('selector checks OK')
          PY

      - name: Validate manifest JSON
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest OK')"

      - name: Check JavaScript id references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pairs = [
              (Path('assets/app.js'), Path('index.html')),
              (Path('account/account.js'), Path('account/index.html')),
              (Path('account/receipt.js'), Path('account/receipt.html')),
              (Path('admin/admin.js'), Path('admin/index.html')),
              (Path('admin/print.js'), Path('admin/print.html')),
          ]

          for js_path, html_path in pairs:
              js = js_path.read_text(encoding='utf-8')
              html = html_path.read_text(encoding='utf-8')
              ids = set(re.findall(r'id=["\']([^"\']+)["\']', html))
              dynamic_ids = set(re.findall(r'id=["\']([^"\']+)["\']', js))
              refs = set(re.findall(r"\$\('#([A-Za-z0-9_-]+)'\)", js))
              missing = sorted(refs - ids - dynamic_ids)
              if missing:
                  raise SystemExit(f'{js_path}: IDs ausentes em {html_path}: {missing}')
              print(f'{js_path}: referências de ID OK ({len(refs)})')
          PY

      - name: Check duplicate HTML ids
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class IdParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key == 'id' and value:
                          self.ids.append(value)

          for path in [Path('index.html'), Path('privacy.html'), Path('account/index.html'), Path('admin/index.html'), Path('admin/print.html')]:
              parser = IdParser()
              parser.feed(path.read_text(encoding='utf-8'))
              duplicates = sorted({x for x in parser.ids if parser.ids.count(x) > 1})
              if duplicates:
                  raise SystemExit(f'{path}: IDs duplicados: {duplicates}')
              print(f'{path}: IDs OK ({len(parser.ids)})')
          PY

      - name: Check professional UI guardrails
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          ui_js = [
              Path('assets/app.js'),
              Path('account/account.js'),
              Path('admin/admin.js'),
              Path('assets/ui.js'),
          ]
          ui_html = [
              Path('index.html'),
              Path('account/index.html'),
              Path('account/receipt.html'),
              Path('admin/index.html'),
              Path('admin/print.html'),
              Path('404.html'),
              Path('privacy.html'),
          ]

          for path in ui_js:
              text = path.read_text(encoding='utf-8')
              hits = re.findall(r'\b(?:alert|confirm)\s*\(', text)
              if hits:
                  raise SystemExit(f'{path}: alert()/confirm() nativo encontrado: {hits[:5]}')

          emoji_re = re.compile(r'[\U0001F300-\U0001FAFF]')
          for path in ui_js + ui_html:
              text = path.read_text(encoding='utf-8')
              if emoji_re.search(text):
                  raise SystemExit(f'{path}: emoji encontrado; use SVG local em assets/icons')

          class ButtonParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.missing = []
              def handle_starttag(self, tag, attrs):
                  if tag != 'button':
                      return
                  data = dict(attrs)
                  if not data.get('type'):
                      self.missing.append(data.get('id') or data.get('class') or '<sem id>')

          for path in ui_html:
              parser = ButtonParser()
              parser.feed(path.read_text(encoding='utf-8'))
              if parser.missing:
                  raise SystemExit(f'{path}: botão sem type explícito: {parser.missing}')
              print(f'{path}: button types OK')

          css = Path('assets/styles.css').read_text(encoding='utf-8')
          icon_dir = Path('assets/icons')
          available = {p.stem for p in icon_dir.glob('*.svg')}
          used = set()

          for path in ui_html:
              text = path.read_text(encoding='utf-8')
              for attrs in re.findall(r'class=["\']([^"\']+)["\']', text):
                  used.update(re.findall(r'\bicon-([a-z0-9-]+)\b', attrs))

          for path in ui_js:
              text = path.read_text(encoding='utf-8')
              used.update(re.findall(r'iconHtml\(["\']([a-z0-9-]+)["\']', text))

          used -= {'button-label', 'wrap'}
          missing_files = sorted(used - available)
          if missing_files:
              raise SystemExit(f'Ícones SVG ausentes: {missing_files}')

          missing_css = sorted(name for name in used if f'.icon-{name}' not in css)
          if missing_css:
              raise SystemExit(f'Ícones sem classe CSS: {missing_css}')

          print(f'icon checks OK ({len(used)} ícones usados)')
          PY

      - name: Check Print Agent version manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re

          project = Path('print-agent/DeliveryPizzaria.PrintAgent.csproj').read_text(encoding='utf-8')
          match = re.search(r'<Version>([^<]+)</Version>', project)
          if not match:
              raise SystemExit('Versão do Print Agent não encontrada no csproj.')

          agent_version = match.group(1).strip()
          manifest = json.loads(Path('assets/print-agent-version.json').read_text(encoding='utf-8'))
          latest = str(manifest.get('latestVersion', '')).strip()
          minimum = str(manifest.get('minimumVersion', '')).strip()

          semver = re.compile(r'^\d+\.\d+\.\d+$')
          if not semver.fullmatch(agent_version):
              raise SystemExit(f'Versão inválida no csproj: {agent_version}')
          if not semver.fullmatch(latest):
              raise SystemExit(f'latestVersion inválida: {latest}')
          if not semver.fullmatch(minimum):
              raise SystemExit(f'minimumVersion inválida: {minimum}')
          if agent_version != latest:
              raise SystemExit(f'Print Agent {agent_version} != manifest latestVersion {latest}')

          print(f'Print Agent version manifest OK: latest={latest}, minimum={minimum}')
          PY

      - name: Check required files
        run: |
          test -f index.html
          test -f privacy.html
          test -f admin/index.html
          test -f account/index.html
          test -f account/receipt.html
          test -f account/receipt.js
          test -f firebase-config.js
          test -f assets/ui.js
          test -f assets/print-agent-version.json
          test -f assets/icons/LICENSE-LUCIDE.txt
          test -f firestore.rules
          test -f manifest.webmanifest
          test -f service-worker.js
          test -f print-agent/DeliveryPizzaria.PrintAgent.csproj
          test -f functions/package.json
          test -f functions/index.js
