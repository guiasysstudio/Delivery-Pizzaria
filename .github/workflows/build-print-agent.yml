name: Build Print Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "print-agent/**"
      - ".github/workflows/build-print-agent.yml"
  pull_request:
    branches: [main]
    paths:
      - "print-agent/**"
      - ".github/workflows/build-print-agent.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve Print Agent version
        id: agent_version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "print-agent/DeliveryPizzaria.PrintAgent.csproj"
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if (-not $version -or $version -notmatch '^\d+\.\d+\.\d+

      - name: Add installer scripts
        shell: pwsh
        run: |
          Copy-Item print-agent/Instalar.cmd print-agent/publish/Instalar.cmd
          Copy-Item print-agent/Desinstalar.cmd print-agent/publish/Desinstalar.cmd

      - name: Validate install, unblock, startup and uninstall lifecycle
        shell: pwsh
        run: |
          $publish = Resolve-Path "print-agent/publish"
          $exe = Join-Path $publish "DeliveryPizzaria.PrintAgent.exe"

          # Simula exatamente um EXE herdando Mark-of-the-Web de um ZIP baixado.
          Set-Content -LiteralPath $exe -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" -NoNewline
          if (-not (Get-Item -LiteralPath $exe -Stream Zone.Identifier -ErrorAction SilentlyContinue)) {
            throw "Nao foi possivel preparar o teste de Mark-of-the-Web."
          }

          Push-Location $publish
          try {
            & cmd.exe /d /c "Instalar.cmd /SILENT"
            if ($LASTEXITCODE -ne 0) {
              throw "Instalar.cmd falhou com codigo $LASTEXITCODE"
            }
          }
          finally {
            Pop-Location
          }

          $target = Join-Path $env:LOCALAPPDATA "DeliveryPizzaria\PrintAgent"
          $installedExe = Join-Path $target "DeliveryPizzaria.PrintAgent.exe"
          $installedUninstaller = Join-Path $target "Desinstalar.cmd"

          if (-not (Test-Path -LiteralPath $installedExe)) { throw "EXE instalado nao encontrado." }
          if (-not (Test-Path -LiteralPath $installedUninstaller)) { throw "Desinstalador instalado nao encontrado." }

          $zone = Get-Item -LiteralPath $installedExe -Stream Zone.Identifier -ErrorAction SilentlyContinue
          if ($zone) { throw "EXE instalado ainda possui Zone.Identifier." }

          $run = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          if (-not $run.DeliveryPizzariaPrintAgent) { throw "Startup do Agent nao foi registrado." }

          $uninstall = Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\DeliveryPizzariaPrintAgent"
          if ($uninstall.DisplayVersion -ne "${{ steps.agent_version.outputs.version }}") { throw "Versao do desinstalador registrada incorretamente." }

          & cmd.exe /d /c "`"$installedUninstaller`" /SILENT"
          if ($LASTEXITCODE -ne 0) {
            throw "Desinstalador falhou com codigo $LASTEXITCODE"
          }

          Start-Sleep -Seconds 4

          if (Test-Path -LiteralPath $target) { throw "Pasta instalada permaneceu apos desinstalacao." }
          if (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\DeliveryPizzariaPrintAgent" -ErrorAction SilentlyContinue) {
            throw "Registro de desinstalacao permaneceu."
          }

      - name: Package Print Agent
        shell: pwsh
        run: Compress-Archive -Path print-agent/publish/* -DestinationPath print-agent/DeliveryPizzaria-PrintAgent-win-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryPizzaria-PrintAgent-win-x64
          path: print-agent/publish/
          if-no-files-found: error

      - name: Publish versioned release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.agent_version.outputs.version }}"
          $tag = "print-agent-v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Delivery Pizzaria Print Agent v$version" --notes "Build automático do agente local de impressão para Windows x64." --target "${{ github.sha }}"
          }
          gh release upload $tag print-agent/DeliveryPizzaria-PrintAgent-win-x64.zip --clobber
