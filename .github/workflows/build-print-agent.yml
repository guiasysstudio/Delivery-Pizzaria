name: Build Print Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "print-agent/**"
      - "assets/print-agent-version.json"
      - "admin/admin.js"
      - "admin/index.html"
      - ".github/workflows/build-print-agent.yml"
  pull_request:
    branches: [main]
    paths:
      - "print-agent/**"
      - "assets/print-agent-version.json"
      - "admin/admin.js"
      - "admin/index.html"
      - ".github/workflows/build-print-agent.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve Print Agent version
        id: agent_version
        shell: pwsh
        run: |
          [xml]$project = Get-Content "print-agent/DeliveryPizzaria.PrintAgent.csproj"
          $version = @($project.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          if (-not $version -or $version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Versao SemVer invalida no csproj: $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Validate version synchronization
        shell: pwsh
        run: |
          $version = "${{ steps.agent_version.outputs.version }}"
          $manifest = Get-Content "assets/print-agent-version.json" -Raw | ConvertFrom-Json
          $program = Get-Content "print-agent/Program.cs" -Raw
          $installer = Get-Content "print-agent/installer/DeliveryPizzaria.PrintAgent.iss" -Raw
          $readme = Get-Content "print-agent/README.md" -Raw
          $admin = Get-Content "admin/admin.js" -Raw
          $adminHtml = Get-Content "admin/index.html" -Raw

          if ($manifest.latestVersion -ne $version) { throw "Manifest latestVersion fora de sincronia." }
          if ($manifest.minimumVersion -ne $version) { throw "Manifest minimumVersion fora de sincronia." }
          if ($manifest.downloadUrl -notmatch "/print-agent-v$([regex]::Escape($version))/DeliveryPizzaria-PrintAgent-Setup-x64\.exe$") {
            throw "Manifest downloadUrl nao aponta para o instalador EXE versionado."
          }
          if ($program -notmatch "Version = `"$([regex]::Escape($version))`"") { throw "AgentInfo fora de sincronia." }
          if ($installer -notmatch "#define MyAppVersion `"$([regex]::Escape($version))`"") { throw "Inno Setup fora de sincronia." }
          if ($readme -notmatch [regex]::Escape($version)) { throw "README fora de sincronia." }
          if ($admin -notmatch "FALLBACK_PRINT_AGENT_VERSION='$([regex]::Escape($version))'") { throw "Fallback do ADM fora de sincronia." }
          if ($admin -notmatch "/print-agent-v$([regex]::Escape($version))/DeliveryPizzaria-PrintAgent-Setup-x64\.exe") { throw "Download fallback do ADM fora de sincronia." }
          if ($adminHtml -notmatch "/print-agent-v$([regex]::Escape($version))/DeliveryPizzaria-PrintAgent-Setup-x64\.exe") { throw "Download inicial do ADM fora de sincronia." }

      - name: Publish self-contained Windows x64 EXE
        shell: pwsh
        run: |
          dotnet publish print-agent/DeliveryPizzaria.PrintAgent.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugSymbols=false `
            -p:DebugType=None `
            -o print-agent/publish

          $exe = "print-agent/publish/DeliveryPizzaria.PrintAgent.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "EXE publicado nao encontrado." }

          $loose = Get-ChildItem "print-agent/publish" -File |
            Where-Object { $_.Extension -in @('.dll','.pdb') }
          if ($loose) {
            throw "O pacote deixou DLL/PDB soltos: $($loose.Name -join ', ')"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer EXE
        shell: pwsh
        run: |
          $version = "${{ steps.agent_version.outputs.version }}"
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "ISCC.exe nao encontrado apos instalar Inno Setup."
          }

          & $iscc "/DMyAppVersion=$version" "print-agent/installer/DeliveryPizzaria.PrintAgent.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Compilacao do instalador falhou com codigo $LASTEXITCODE."
          }

          $setup = "print-agent/dist/DeliveryPizzaria-PrintAgent-Setup-x64.exe"
          if (-not (Test-Path -LiteralPath $setup)) {
            throw "Instalador EXE nao foi gerado."
          }

      - name: Validate install, shortcut, reopen, startup and uninstall lifecycle
        shell: pwsh
        run: |
          $version = "${{ steps.agent_version.outputs.version }}"
          $setup = (Resolve-Path "print-agent/dist/DeliveryPizzaria-PrintAgent-Setup-x64.exe").Path
          $target = Join-Path $env:LOCALAPPDATA "Programs\GuiaSys\Delivery Pizzaria Print Agent CI"
          $desktop = [Environment]::GetFolderPath('Desktop')
          $desktopShortcut = Join-Path $desktop "Delivery Pizzaria Print Agent.lnk"

          Remove-Item -LiteralPath $target -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $desktopShortcut -Force -ErrorAction SilentlyContinue
          Remove-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "DeliveryPizzariaPrintAgent" -ErrorAction SilentlyContinue

          & $setup /VERYSILENT /SUPPRESSMSGBOXES /NORESTART "/DIR=$target"
          if ($LASTEXITCODE -ne 0) {
            throw "Instalador EXE falhou com codigo $LASTEXITCODE."
          }

          $installedExe = Join-Path $target "DeliveryPizzaria.PrintAgent.exe"
          if (-not (Test-Path -LiteralPath $installedExe)) { throw "EXE instalado nao encontrado." }
          if (-not (Test-Path -LiteralPath $desktopShortcut)) { throw "Atalho da Area de Trabalho nao foi criado." }

          $loose = Get-ChildItem $target -File |
            Where-Object { $_.Extension -in @('.dll','.pdb') }
          if ($loose) { throw "Instalacao contem DLL/PDB soltos: $($loose.Name -join ', ')" }

          $startup = Get-ItemPropertyValue "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "DeliveryPizzariaPrintAgent"
          if ($startup -notmatch [regex]::Escape($installedExe) -or $startup -notmatch "--background") {
            throw "Startup nao aponta para o EXE instalado em modo background."
          }

          $uninstallEntry = Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
            ForEach-Object { Get-ItemProperty $_.PSPath -ErrorAction SilentlyContinue } |
            Where-Object { $_.DisplayName -eq "Delivery Pizzaria Print Agent" } |
            Select-Object -First 1
          if (-not $uninstallEntry) { throw "Agent nao foi registrado em Aplicativos instalados." }
          if ($uninstallEntry.DisplayVersion -ne $version) { throw "Versao do desinstalador incorreta." }

          $agent = Start-Process -FilePath $installedExe -ArgumentList "--background" -PassThru
          $healthy = $false
          for ($i=0; $i -lt 30; $i++) {
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:17329/health" -TimeoutSec 1
              if ($health.ok -eq $true -and $health.version -eq $version) {
                $healthy = $true
                break
              }
            } catch {}
            Start-Sleep -Milliseconds 250
          }
          if (-not $healthy) { throw "Agent instalado nao respondeu ao /health." }

          # Executar o atalho/--open com a instancia ativa precisa reutilizar
          # o processo existente, nao abrir um segundo servidor na porta 17329.
          $second = Start-Process -FilePath $installedExe -ArgumentList "--open" -PassThru -Wait
          Start-Sleep -Milliseconds 500
          if ($agent.HasExited) { throw "Instancia principal encerrou ao reabrir pelo atalho." }
          $health = Invoke-RestMethod -Uri "http://127.0.0.1:17329/health" -TimeoutSec 2
          if ($health.version -ne $version) { throw "Agent deixou de responder apos reabrir pelo atalho." }

          $uninstaller = Get-ChildItem $target -Filter "unins*.exe" -File | Select-Object -First 1
          if (-not $uninstaller) { throw "Desinstalador EXE do Inno Setup nao encontrado." }

          & $uninstaller.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART
          if ($LASTEXITCODE -ne 0) {
            throw "Desinstalador EXE falhou com codigo $LASTEXITCODE."
          }

          Start-Sleep -Seconds 3

          if (Test-Path -LiteralPath $target) { throw "Pasta instalada permaneceu apos desinstalacao." }
          if (Test-Path -LiteralPath $desktopShortcut) { throw "Atalho do Desktop permaneceu apos desinstalacao." }
          $startupAfter = Get-ItemPropertyValue "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run" -Name "DeliveryPizzariaPrintAgent" -ErrorAction SilentlyContinue
          if ($startupAfter) { throw "Startup permaneceu apos desinstalacao." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryPizzaria-PrintAgent-Setup-x64
          path: print-agent/dist/DeliveryPizzaria-PrintAgent-Setup-x64.exe
          if-no-files-found: error

      - name: Publish versioned release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.agent_version.outputs.version }}"
          $tag = "print-agent-v$version"
          $setup = "print-agent/dist/DeliveryPizzaria-PrintAgent-Setup-x64.exe"

          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag `
              --title "Delivery Pizzaria Print Agent v$version" `
              --notes "Instalador EXE do agente local de impressao para Windows x64. Cria atalhos, inicia com o Windows e possui desinstalador integrado." `
              --target "${{ github.sha }}"
          }

          gh release upload $tag $setup --clobber
