name: Build Print Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "print-agent/**"
      - ".github/workflows/build-print-agent.yml"
  pull_request:
    branches: [main]
    paths:
      - "print-agent/**"
      - ".github/workflows/build-print-agent.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish Windows x64
        run: dotnet publish print-agent/DeliveryPizzaria.PrintAgent.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o print-agent/publish

      - name: Add installer scripts
        shell: pwsh
        run: |
          Copy-Item print-agent/Instalar.cmd print-agent/publish/Instalar.cmd
          Copy-Item print-agent/Desinstalar.cmd print-agent/publish/Desinstalar.cmd

      - name: Package Print Agent
        shell: pwsh
        run: Compress-Archive -Path print-agent/publish/* -DestinationPath print-agent/DeliveryPizzaria-PrintAgent-win-x64.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeliveryPizzaria-PrintAgent-win-x64
          path: print-agent/publish/
          if-no-files-found: error

      - name: Publish stable download release
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view print-agent-latest *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create print-agent-latest --title "Delivery Pizzaria Print Agent" --notes "Build automático do agente local de impressão para Windows x64." --prerelease --target "${{ github.sha }}"
          }
          gh release upload print-agent-latest print-agent/DeliveryPizzaria-PrintAgent-win-x64.zip --clobber
